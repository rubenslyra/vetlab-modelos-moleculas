; ---------------------------------------------------------------------------
; VET-Lab — pgbouncer.ini
;
; Pool transacional na frente do PostgreSQL. A aplicação conecta aqui (6432);
; apenas pgAdmin/administração usa a porta direta do PostgreSQL (5432).
;
; auth_file (userlist.txt) NÃO é versionado: é gerado no start do contêiner
; a partir de SVC_DB_USER/SVC_DB_PASSWORD e SVC_DB_READONLY_*.
; ---------------------------------------------------------------------------

[databases]
vetlab_db = host=postgres port=5432 dbname=vetlab_db
postgres  = host=postgres port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

admin_users = postgres
stats_users = svc_readonly

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 60
max_user_connections = 30

server_lifetime = 3600
server_idle_timeout = 300
server_connect_timeout = 10
server_login_retry = 5
query_wait_timeout = 30

client_idle_timeout = 0
idle_transaction_timeout = 60

ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
