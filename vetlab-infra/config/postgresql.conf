# ---------------------------------------------------------------------------
# VET-Lab — postgresql.conf
#
# Só contém overrides. Parâmetros não listados usam o default do PostgreSQL 18.
# Dimensionado para o limite de memória do contêiner (1536 MB, ver compose).
# Referência de cada parâmetro: https://www.postgresql.org/docs/18/runtime-config.html
# ---------------------------------------------------------------------------

# --- Conexões ---------------------------------------------------------------
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
max_connections = 100
superuser_reserved_connections = 3

# --- Memória ----------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
temp_file_limit = 1GB
huge_pages = try

# --- WAL / checkpoints ------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = on
archive_mode = off

# --- Autenticação e TLS -----------------------------------------------------
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- Extensões pré-carregadas ----------------------------------------------
# Só entram aqui as que exigem shared_preload_libraries para funcionar.
# pg_partman NÃO usa background worker: a manutenção é agendada via pg_cron
# (recomendação oficial do pg_partman 5.x). Ver docs/decisions/0003-*.md.
shared_preload_libraries = 'pg_stat_statements,pgaudit,pg_cron'

pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on

pgaudit.log = 'ddl, role'
pgaudit.log_catalog = off

cron.database_name = 'vetlab_db'
cron.log_run = on

# --- Observabilidade / logs -------------------------------------------------
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000
log_error_verbosity = default
log_timezone = 'America/Sao_Paulo'

# --- Sessão -----------------------------------------------------------------
timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.portuguese'
idle_in_transaction_session_timeout = '60s'
statement_timeout = 0
row_security = on
