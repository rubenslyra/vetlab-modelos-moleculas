# ---------------------------------------------------------------------------
# VET-Lab — pg_hba.conf
#
# Modelo de acesso:
#   * socket local   -> trust  (só existe dentro do contêiner; usado pelos
#                               scripts de inicialização e por pg-backup)
#   * TCP (qualquer) -> scram-sha-256 (obrigatório para pgbouncer, pgAdmin e
#                               qualquer cliente externo)
#
# Não há entradas `trust` para TCP: todo acesso remoto exige senha.
# ---------------------------------------------------------------------------

# TYPE      DATABASE  USER  ADDRESS       METHOD
local       all       all                 trust

host        all       all   127.0.0.1/32  scram-sha-256
host        all       all   ::1/128       scram-sha-256
host        all       all   all           scram-sha-256

# Replicação lógica/física fica desabilitada neste ambiente (ver docs/decisions).
